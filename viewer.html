<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>WatchOut - 실시간 카메라</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f0f0f; color: #fff; font-family: sans-serif;
           display: flex; flex-direction: column; align-items: center;
           justify-content: center; height: 100vh; gap: 16px; }
    h1 { font-size: 1.1rem; letter-spacing: 0.1em; color: #aaa; }
    video { width: 100%; max-width: 900px; border-radius: 8px; background: #1a1a1a; }
    .controls { display: flex; gap: 8px; align-items: center; }
    input { background: #1e1e1e; border: 1px solid #333; color: #fff;
            padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; width: 260px; }
    button { padding: 6px 16px; background: #3b82f6; color: #fff;
             border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    button:hover { background: #2563eb; }
    #status { font-size: 0.8rem; color: #555; }
  </style>
</head>
<body>
  <h1>WATCHOUT — 실시간 카메라</h1>
  <div class="controls">
    <input id="url" type="text" placeholder="http://10.80.162.190:8080" value="" />
    <button onclick="connect()">연결</button>
  </div>
  <video id="stream" autoplay playsinline muted></video>
  <p id="status">주소를 입력하고 연결 버튼을 누르세요.</p>

  <script>
    const video = document.getElementById("stream");
    const status = document.getElementById("status");
    let pc = null;

    // 서버에서 열린 경우 URL 자동 입력
    if (location.origin !== "null") {
      document.getElementById("url").value = location.origin;
    }

    function setStatus(text, color) {
      status.textContent = text;
      status.style.color = color || "#555";
    }

    async function connect() {
      const input = document.getElementById("url").value.trim();
      if (!input) return;

      const base = input.replace(/\/(offer|stream)\/?$/, "").replace(/\/$/, "");
      const offerUrl = base + "/offer";

      if (pc) {
        pc.close();
        pc = null;
        video.srcObject = null;
      }

      setStatus("연결 중...", "#888");

      // 로컬 변수로 캡처 — 이후 connect() 재호출로 pc가 바뀌어도 이 시도는 독립적으로 동작
      const localPc = new RTCPeerConnection({
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
      });
      pc = localPc;

      try {
        localPc.ontrack = (e) => {
          if (localPc !== pc) return;
          video.srcObject = e.streams[0];
          setStatus("스트리밍 중", "#4ade80");
        };

        localPc.onconnectionstatechange = () => {
          if (localPc !== pc) return;
          const s = localPc.connectionState;
          if (s === "failed" || s === "disconnected") {
            setStatus("연결 끊김 - " + s, "#f87171");
          }
        };

        localPc.addTransceiver("video", { direction: "recvonly" });

        const offer = await localPc.createOffer();
        await localPc.setLocalDescription(offer);

        // Wait for ICE gathering (max 5s)
        await new Promise(resolve => {
          if (localPc.iceGatheringState === "complete") { resolve(); return; }
          const timeout = setTimeout(resolve, 5000);
          localPc.addEventListener("icegatheringstatechange", () => {
            if (localPc.iceGatheringState === "complete") { clearTimeout(timeout); resolve(); }
          });
        });

        // 이미 다른 connect()가 실행됐으면 중단
        if (localPc !== pc) return;

        const res = await fetch(offerUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sdp: localPc.localDescription.sdp, type: localPc.localDescription.type })
        });

        if (!res.ok) throw new Error("서버 오류 " + res.status);

        const answer = await res.json();

        if (localPc !== pc) return;
        await localPc.setRemoteDescription(answer);

      } catch (e) {
        if (localPc === pc) setStatus("연결 실패 - " + e.message, "#f87171");
      }
    }

    document.getElementById("url").addEventListener("keydown", (e) => {
      if (e.key === "Enter") connect();
    });
  </script>
</body>
</html>
